<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fork Scanner Reports</title>
<style>
:root{--bg:#f8f9fa;--surface:#fff;--text:#1a1a2e;--text-secondary:#555;--border:#dee2e6;--accent:#4361ee}
@media(prefers-color-scheme:dark){:root{--bg:#0f0f23;--surface:#1a1a2e;--text:#eaeaea;--text-secondary:#9ca3af;--border:#2d2d44;--accent:#5e7ce2}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding:48px 24px}
.container{max-width:800px;margin:0 auto}
h1{font-size:2rem;margin-bottom:8px}
.subtitle{color:var(--text-secondary);margin-bottom:32px}
.list{display:grid;gap:12px}
.item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.item-name{font-weight:700;font-size:1.1rem}
.item-name a{color:var(--accent);text-decoration:none}
.item-name a:hover{text-decoration:underline}
.item-meta{color:var(--text-secondary);font-size:0.85rem}
</style>
</head>
<body>
<div class="container">
<h1>🔬 Fork Scanner Reports</h1>
<div class="subtitle">Published community fork analyses</div>
<div class="list">
  <div class="item">
    <div>
      <div class="item-name"><a href="mrlesk-backlog.md/">MrLesk/Backlog.md</a></div>
      <div class="item-meta">341 forks · Stage 1 + Stage 2 deep analysis</div>
    </div>
    <div><a href="mrlesk-backlog.md/" style="color:var(--accent);font-weight:600">View →</a></div>
  </div>
</div>
</div>
</body>
</html>
