*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}

.incremental-entry .entry-date{font-weight:600;color:var(--accent);font-size:0.8rem}

.no-prs{padding:8px;border-left:3px solid var(--orange);background:var(--accent-light);border-radius:4px;font-size:0.85rem}
.fork-actions{display:flex;gap:12px;align-items:center;margin:8px 0;flex-wrap:wrap}

  `<div class="stat-card"><div class="num" style="color:${k==='total'?'var(--accent)':k==='highValue'?'var(--green)':'var(--text)'}">${v}</div><div class="label">${k}</div></div>`
).join("");

document.getElementById("matrixBody").innerHTML = (D.ordered || []).map((f,i) => {
  const pr = f.prs || [];
  const m = pr.filter(p=>p.merged_at).length;
  const o = pr.filter(p=>!p.merged_at&&p.state==='open').length;
  const prLabel = m ? m+' merged' : o ? o+' open' : pr.length ? pr.length+' closed' : 'No PR';
  const prClass = m?'pr-merged':o?'pr-open':pr.length?'pr-closed':'pr-none';
  return `<tr>
    <td>${i+1}</td>
    <td><a href="https://github.com/${esc(f.full_name)}" target="_blank"><strong>${esc(f.full_name)}</strong></a></td>
    <td>${esc(f.title||'')}</td>
    <td><span class="pill value-${f.value}">${f.value}</span></td>
    <td><span class="pill" style="background:${['#f8d7da','#f8d7da','#fff3cd','#cce5ff','#d4edda'][f.upstream-1]};color:${['#721c24','#721c24','#856404','#004085','#155724'][f.upstream-1]}">${f.upstream}/5</span></td>
    <td><span class="pill" style="background:${f.focus==='feature'?'#cce5ff':f.focus==='fix'?'#d4edda':'#fff3cd'};color:${f.focus==='feature'?'#004085':f.focus==='fix'?'#155724':'#856404'}">${f.focus}</span></td>
    <td><span class="pill ${prClass}">${prLabel}</span></td>
    <td>${(f.tags||[]).slice(0,4).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</td>
  </tr>`;
}).join('');

const hData = D.heatmap || [];
document.getElementById("featureCount").textContent = hData.length + ' feature categories across ' + D.forkCount + ' forks';
var maxFreq = hData.length > 0 ? hData[0][1] : 1;
document.getElementById("heatmapBody").innerHTML = hData.map(([feat,count]) =>
  `<tr><td><strong>${esc(feat)}</strong></td><td>${count}</td><td>${(count/D.forkCount*100).toFixed(0)}%</td>
  <td><div style="height:20px;background:var(--accent-light);border-radius:4px;overflow:hidden">
  <div style="width:${Math.max(10,count/maxFreq*100)}%;height:100%;background:var(--accent);border-radius:4px"></div></div></td></tr>`
).join('');

// Coverage statement
const cov = document.getElementById("deepCoverage");
const totalInteresting = D.stats.interestingForks || 0;
const deepCount = D.stats.deepAnalyzed || 0;
const pct = totalInteresting > 0 ? Math.round(deepCount / totalInteresting * 100) : 0;
cov.textContent = deepCount + " of " + totalInteresting + " interesting forks deep analyzed (" + pct + "% coverage). Checkboxes + notes saved via serve.ts or localStorage fallback.";

// Fork details
const detailsEl = document.getElementById("forkDetails");
D.details.forEach(f => {
  const isOpen = D.notes && D.notes[f.full_name] && D.notes[f.full_name].checked;
  const prs = f.prs || [];
  prs.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  const merged = prs.filter(p=>p.merged_at);
  const open = prs.filter(p=>!p.merged_at&&p.state==='open');
  const note = (D.notes&&D.notes[f.full_name])||{checked:false,note:''};

  var card = document.createElement('div');
  card.className = 'detail-card' + (isOpen ? ' open' : '');
  card.innerHTML = `<div class="detail-header" onclick="this.parentElement.classList.toggle('open')">
    <strong>${esc(f.full_name)}</strong>
    <span class="pill value-${f.value}">${f.value}</span>
    <span class="pill" style="background:${['#f8d7da','#f8d7da','#fff3cd','#cce5ff','#d4edda'][f.upstream-1]};color:${['#721c24','#721c24','#856404','#004085','#155724'][f.upstream-1]}">Upstr ${f.upstream}/5</span>
    ${prs.length ? '<span class="pill '+(merged.length?'pr-merged':open.length?'pr-open':'pr-closed')+'">'+(merged.length||open.length||prs.length)+' PRs</span>' : '<span class="pill pr-none">No PR</span>'}
  </div>
  <div class="detail-body">
    <div class="detail-meta">
      <span>📅 ${f.pushed_at ? new Date(f.pushed_at).toISOString().slice(0,10) : '?'}</span>
      <span>📈 +${f.max_ahead} ahead${f.max_behind > 0 ? ' / -'+f.max_behind+' behind' : ''}</span>
      <span>📁 ${f.files||0} files</span>
      <span>➕ +${f.adds||0} / ➖ -${f.dels||0} lines</span>
      <span>🔗 <a href="https://github.com/${esc(f.full_name)}" target="_blank">View</a></span>
    </div>
    <strong>${esc(f.title||'')}</strong>
    <div class="detail-desc">${esc(f.description||'')}</div>
    ${f._updates && f._updates.length ? '<div class="incremental-timeline">'+f._updates.map(u => {
      const ts = u.date ? new Date(u.date).toISOString().slice(0,16).replace('T',' ') : '';
      const badgeCls = u.change === 'new' ? 'pill-new' : u.change === 'updated' ? 'pill-updated' : 'pill-rewritten';
      const changeLabel = u.change === 'new' ? 'New' : u.change === 'updated' ? '▲ '+u.new_commits+' new' : '⚠ Rewritten';
      const extra = u.upstreamability !== undefined ? ' · Upstr '+u.upstreamability+'/5' : '';
      if (u._is_current) {
        return '<div class="incremental-entry current"><div class="entry-date"><span class="pill '+badgeCls+'" style="margin-right:6px">'+changeLabel+'</span>'+ts+'</div><div class="entry-analysis">'+esc(u.analysis)+(u.value_assessment ? ' <span class="pill value-'+u.value_assessment+'">'+u.value_assessment+'</span>' : '')+extra+'</div></div>';
      }
      return '<div class="incremental-entry"><div class="entry-date"><span class="pill '+badgeCls+'" style="margin-right:6px">'+changeLabel+'</span>'+ts+'</div><div class="entry-analysis">'+esc(u.analysis)+(u.value_assessment ? ' <span class="pill value-'+u.value_assessment+'">'+u.value_assessment+'</span>' : '')+extra+'</div></div>';
    }).join('\n')+'</div>' : ''}
    <div style="margin:4px 0">${(f.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')}</div>
    ${prs.length ? prs.map(p => {
      const stateIcon = p.merged_at ? '✅ Merged' : p.state==='open' ? '📌 Open' : '❌ Closed';
      const str = p.reaction_count ? ' · '+p.reaction_count+' reactions' : '';
      return '<div class="pr-entry"><a href="https://github.com/MrLesk/Backlog.md/pull/'+p.number+'" target="_blank"><strong>#'+p.number+'</strong></a> '+stateIcon+' <span style="font-size:0.8rem;color:var(--text-secondary)">created '+String(p.created_at||'').slice(0,10)+(p.merged_at?' · merged '+String(p.merged_at).slice(0,10):'')+str+'</span><div style="font-size:0.85rem;color:var(--text-secondary)">'+esc(p.title||'')+'</div></div>';
    }).join('') : '<div class="no-prs">⚠️ No PRs found from this fork owner to upstream</div>'}
    ${f.branches && f.branches.length ? '<details style="margin-top:8px"><summary style="font-size:0.85rem;padding:6px 8px;cursor:pointer">Branches ('+f.branches.length+')</summary><ul style="padding:8px;list-style:none">'+f.branches.map(b=>'<li style="margin:4px 0;font-family:monospace;font-size:0.85rem"><strong>'+esc(b.name)+'</strong> +'+b.ahead+'/-'+b.behind+' · '+b.files+' files</li>').join('')+'</ul></details>' : ''}
    <div class="fork-actions">
      <label><input type="checkbox" class="fork-check" data-fork="${esc(f.full_name)}" ${note.checked?'checked':''} onchange="saveNote('${esc(f.full_name)}')"> Further analysis needed</label>
      <label style="opacity:0.6"><input type="checkbox" class="fork-exclude" data-fork="${esc(f.full_name)}" ${note.excluded?'checked':''} onchange="saveNote('${esc(f.full_name)}')"> Exclude from view</label>
      <textarea class="fork-note" data-fork="${esc(f.full_name)}" placeholder="What to analyze further..." onchange="saveNote('${esc(f.full_name)}')">${esc(note.note)}</textarea>
    </div>
  </div>`;
  // Set attributes for filtering
  card.setAttribute('data-change', f._change || 'unchanged');
  card.setAttribute('data-excluded', note.excluded ? 'true' : 'false');
  if (note.excluded) card.classList.add('excluded');
  detailsEl.appendChild(card);
});

function applyDetailFilter() {
  const active = [...document.querySelectorAll('#changeFilter input:checked')].map(cb => cb.value);
  const showExcluded = active.includes('excluded');
  document.querySelectorAll('.detail-card').forEach(card => {
    const change = card.getAttribute('data-change') || 'unchanged';
    const isExcluded = card.getAttribute('data-excluded') === 'true';
    if (isExcluded && !showExcluded) { card.style.display = 'none'; return; }
    card.style.display = active.includes(change) ? '' : 'none';
  });
}

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

function saveNote(fork) {
  var el = document.querySelector('.detail-card .detail-body .fork-check[data-fork="'+fork+'"]');
  if (!el) return;
  var card = el.closest('.detail-card');
  var checked = card.querySelector('.fork-check').checked;
  var excluded = card.querySelector('.fork-exclude').checked;
  var note = card.querySelector('.fork-note').value;
  var data = {};
  try { data = JSON.parse(localStorage.getItem('fork-notes')||'{}'); } catch(e) { data = {}; }
  data[fork] = {checked,excluded,note};
  localStorage.setItem('fork-notes',JSON.stringify(data));
  // Update card state immediately
  card.setAttribute('data-excluded', excluded ? 'true' : 'false');
  if (excluded) card.classList.add('excluded'); else card.classList.remove('excluded');
  applyDetailFilter();
  // Try server save
  fetch('#',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fork,checked,excluded,note})}).catch(()=>{});
}

// Load notes from localStorage on page load
(function(){
  try {
    var raw = localStorage.getItem('fork-notes');
    if (raw === '[object Object]') { localStorage.removeItem('fork-notes'); raw = null; }
    var notes = JSON.parse(raw||'{}');
    Object.entries(notes).forEach(([fork,n]) => {
      var card = document.querySelector('.detail-card .detail-body .fork-check[data-fork="'+fork+'"]');
      if (!card) return;
      var c = card.closest('.detail-card');
      var cb = c.querySelector('.fork-check');
      var ex = c.querySelector('.fork-exclude');
      var ta = c.querySelector('.fork-note');
      if(cb) cb.checked = n.checked;
      if(ex) { ex.checked = n.excluded; c.setAttribute('data-excluded', n.excluded ? 'true' : 'false'); if (n.excluded) c.classList.add('excluded'); else c.classList.remove('excluded'); }
      if(ta) ta.value = n.note||'';
    });
    // Apply exclusion filter on load
    var showExcludedCheckbox = document.querySelector('#changeFilter input[value="excluded"]');
    if (showExcludedCheckbox && !showExcludedCheckbox.checked) applyDetailFilter();
  } catch(e){}
})();

// Charts
new Chart(document.getElementById("statusChart"),{
  type:"doughnut",
  data:{labels:["Identical","Behind","Ahead (Bot)","Ahead (Human)"],
    datasets:[{data:[D.stats.identical,D.stats.behind,D.stats.aheadBot,D.stats.aheadHuman],
    backgroundColor:["#6c757d","#ff9f1c","#adb5bd","#2ec4b6"],borderWidth:0}]},
  options:{responsive:true,plugins:{legend:{position:"bottom"}}}
});

new Chart(document.getElementById("featureChart"),{
  type:"bar",
  data:{labels:hData.slice(0,20).map(x=>x[0]),datasets:[{data:hData.slice(0,20).map(x=>x[1]),backgroundColor:"#5e7ce2",borderRadius:6}]},
  options:{responsive:true,indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{stepSize:1}}}}
});
</script>
</body>
</html>
