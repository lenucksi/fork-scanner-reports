<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fork Scanner — Reports</title>
<style>
:root{--bg:#f8f9fa;--surface:#fff;--text:#1a1a2e;--text-secondary:#555;--border:#dee2e6;--accent:#4361ee;--accent-light:#eef0ff;--green:#2ec4b6}
@media(prefers-color-scheme:dark){:root{--bg:#0f0f23;--surface:#1a1a2e;--text:#eaeaea;--text-secondary:#9ca3af;--border:#2d2d44;--accent:#5e7ce2;--accent-light:#1a1a3e}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.container{max-width:1000px;margin:0 auto;padding:calc(48px + 48px) 24px 48px;text-align:center}
h1{font-size:2.5rem;margin-bottom:8px}
.subtitle{color:var(--text-secondary);margin-bottom:48px;font-size:1.1rem}
.repo-list{display:grid;gap:16px;text-align:left}
.repo-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;transition:border-color .2s}
.repo-card:hover{border-color:var(--accent)}
.repo-name{font-size:1.1rem;font-weight:700}
.repo-meta{color:var(--text-secondary);font-size:0.85rem}
.repo-links{display:flex;gap:8px}
.repo-links a{padding:6px 14px;border-radius:6px;background:var(--accent-light);color:var(--accent);text-decoration:none;font-size:0.85rem;font-weight:600}
.repo-links a:hover{background:var(--accent);color:#fff}
.empty{color:var(--text-secondary);font-size:1.1rem;padding:48px}
</style>
</head>
<body>
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
<nav class="fs-nav">
  <div class="fs-nav-inner">
    <a href="." class="fs-nav-logo">⬡ Fork Scanner</a>
    <a href="report-stage1.html" class="fs-nav-link">Stage 1</a>
    <a href="report-stage2.html" class="fs-nav-link">Stage 2</a>
    <span class="fs-nav-spacer"></span>
    <select id="fsVersionSelect" onchange="location=this.value">
      <option value="">Latest report</option>
      
    </select>
  </div>
</nav>
<style>
.fs-nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:48px;display:flex;align-items:center;font-family:system-ui,sans-serif}
.fs-nav-inner{display:flex;align-items:center;gap:16px;max-width:1400px;margin:0 auto;width:100%}
.fs-nav-logo{font-weight:700;color:var(--accent);text-decoration:none;font-size:1rem;white-space:nowrap}
.fs-nav-link{color:var(--text-secondary);text-decoration:none;padding:4px 10px;border-radius:4px;font-size:0.85rem;font-weight:600;white-space:nowrap}
.fs-nav-link:hover{color:var(--text);background:var(--accent-light)}
.fs-nav-spacer{flex:1}
#fsVersionSelect{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:0.8rem;max-width:320px}
</style>
<div class="container">
<h1>🔬 Fork Scanner Reports</h1>
<div class="subtitle">Community fork analysis for open source projects</div>
<div class="repo-list" id="repoList"></div>
<div class="footer" style="margin-top:48px;color:var(--text-secondary);font-size:0.85rem">
Generated by fork-scanner · 2026-06-01
</div>
</div>
<script>
window.__REPOS__ = [{"file":"report-stage1.html","stage":"Stage 2","timestamp":"2026-06-01T00:29:06.084Z","forks":313,"interesting":124,"seq":1},{"file":"report-stage2.html","stage":"Stage 2","timestamp":"2026-06-01T00:29:06.084Z","forks":313,"interesting":124,"seq":2},{"file":"report-stage2-v1.html","stage":"Stage 2","timestamp":"2026-06-01T00:29:06.084Z","forks":313,"interesting":124,"seq":3}];

function fmtDate(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  return d.toISOString().slice(0, 10) + " " + d.toTimeString().slice(0, 5);
}

function cls(change) {
  if (change === "new") return "pill-new";
  if (change === "updated") return "pill-updated";
  if (change === "rewritten") return "pill-rewritten";
  return "";
}

const list = document.getElementById("repoList");
const repos = window.__REPOS__;

if (!repos || repos.length === 0) {
  list.innerHTML = '<div class="empty">No reports generated yet.</div>';
} else {
  list.innerHTML = repos.map(r => {
    const label = r.seq ? r.stage + " #" + r.seq : r.stage;
    const ts = fmtDate(r.timestamp);
    return `
    <div class="repo-card ${cls(r._change)}">
      <div>
        <div class="repo-name">${esc(label)}</div>
        <div class="repo-meta">${ts}</div>
      </div>
      <div class="repo-links">
        <a href="${r.file}">View</a>
      </div>
    </div>
  `}).join('');
}

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
</script>
</body>
</html>
